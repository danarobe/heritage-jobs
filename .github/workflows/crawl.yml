name: 공고 수집

on:
  schedule:
    # 한국시간 매일 07:30, 12:30, 18:30 (UTC 22:30 / 03:30 / 09:30)
    - cron: '30 22 * * *'
    - cron: '30 3 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 공고 수집
        run: node scripts/crawl.mjs
      - name: 결과 저장
        run: |
          git config user.name "heritage-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 공고 데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
